<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2000" viewBox="0 0 1800 2000"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect width="1800" height="2000" fill="white"/><text x="50" y="59" font-family="Arial,sans-serif" font-size="34" fill="#334155"><tspan x="50" dy="0">DJ COPILOT · Arquitectura de la API</tspan></text><text x="50" y="98" font-family="Arial,sans-serif" font-size="20" fill="#334155"><tspan x="50" dy="0">Propuesta documental · MVP: un usuario y 50–100 canciones · Sin implementación todavía</tspan></text><rect x="35" y="130" width="1730" height="820" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="60" y="177" font-family="Arial,sans-serif" font-size="27" fill="#334155"><tspan x="60" dy="0">01 / Capas y responsabilidades</tspan></text><rect x="70" y="225" width="250" height="105" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="88" y="260" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="88" dy="0">Cliente / DJ</tspan></text><text x="88" y="291" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="88" dy="0">Petición HTTP</tspan><tspan x="88" dy="22.1">Interfaz futura</tspan></text><rect x="380" y="225" width="340" height="105" rx="12" fill="#dbeafe" stroke="#cbd5e1" stroke-width="2"/><text x="398" y="260" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="398" dy="0">api/routers/</tspan></text><text x="398" y="291" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="398" dy="0">Endpoints y delegación</tspan><tspan x="398" dy="22.1">health · tracks · imports · chat</tspan></text><rect x="790" y="225" width="370" height="105" rx="12" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/><text x="808" y="260" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="808" dy="0">api/services/</tspan></text><text x="808" y="291" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="808" dy="0">Coordinan los casos de uso</tspan><tspan x="808" dy="22.1">Importar · analizar · recomendar</tspan></text><path d="M 330 275 L 370 275" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 730 275 L 780 275" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="385" width="340" height="110" rx="12" fill="#dbeafe" stroke="#cbd5e1" stroke-width="2"/><text x="398" y="420" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="398" dy="0">api/schemas/</tspan></text><text x="398" y="451" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="398" dy="0">Valida entradas y respuestas</tspan><tspan x="398" dy="22.1">Contratos HTTP con Pydantic</tspan></text><path d="M 550 340 L 550 375" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="790" y="385" width="370" height="110" rx="12" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/><text x="808" y="420" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="808" dy="0">api/domain/</tspan></text><text x="808" y="451" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="808" dy="0">Canción · análisis · criterios</tspan><tspan x="808" dy="22.1">Entidades y reglas musicales</tspan></text><path d="M 975 340 L 975 375" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="1250" y="225" width="465" height="120" rx="12" fill="#ede9fe" stroke="#cbd5e1" stroke-width="2"/><text x="1268" y="260" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="1268" dy="0">api/repositories/</tspan></text><text x="1268" y="291" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="1268" dy="0">Contratos + persistencia</tspan><tspan x="1268" dy="22.1">Catálogo · análisis · trabajos · contexto</tspan></text><path d="M 1170 275 L 1240 275" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="1250" y="395" width="465" height="110" rx="12" fill="#ede9fe" stroke="#cbd5e1" stroke-width="2"/><text x="1268" y="430" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="1268" dy="0">api/db/</tspan></text><text x="1268" y="461" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="1268" dy="0">Tablas y sesiones SQLAlchemy</tspan><tspan x="1268" dy="22.1">SQLite propuesto para el catálogo local</tspan></text><path d="M 1480 355 L 1480 385" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="790" y="565" width="370" height="115" rx="12" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/><text x="808" y="600" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="808" dy="0">api/integrations/</tspan></text><text x="808" y="631" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="808" dy="0">Contratos + adaptadores</tspan><tspan x="808" dy="22.1">Audio · metadatos · vectores · LLM</tspan></text><path d="M 1170 310 L 1205 310" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1205 310 L 1205 620" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1205 620 L 1170 620" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="1250" y="565" width="465" height="115" rx="12" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/><text x="1268" y="600" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="1268" dy="0">Herramientas y almacenamiento</tspan></text><text x="1268" y="631" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="1268" dy="0">Essentia: candidato para audio</tspan><tspan x="1268" dy="22.1">Índice vectorial y LLM por elegir</tspan></text><path d="M 1170 655 L 1240 655" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="70" y="587" font-family="Arial,sans-serif" font-size="22" fill="#334155"><tspan x="70" dy="0">Cómo leer el mapa</tspan></text><text x="70" y="623" font-family="Arial,sans-serif" font-size="18" fill="#334155"><tspan x="70" dy="0">Flechas: llamadas o uso de componentes.</tspan><tspan x="70" dy="23.400000000000002">El retorno de datos se omite para facilitar la lectura.</tspan><tspan x="70" dy="23.400000000000002">Servicios dependen de contratos; las implementaciones</tspan><tspan x="70" dy="23.400000000000002">se conectarán mediante dependencies.py.</tspan></text><rect x="70" y="745" width="520" height="150" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="88" y="780" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="88" dy="0">Composición de la aplicación</tspan></text><text x="88" y="811" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="88" dy="0">main.py: crea FastAPI y registra routers</tspan><tspan x="88" dy="22.1">dependencies.py: conecta implementaciones</tspan><tspan x="88" dy="22.1">exception_handlers.py: errores → HTTP</tspan></text><rect x="625" y="745" width="530" height="150" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="643" y="780" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="643" dy="0">api/core/ · soporte transversal</tspan></text><text x="643" y="811" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="643" dy="0">Configuración desde el entorno</tspan><tspan x="643" dy="22.1">Excepciones y registros</tspan><tspan x="643" dy="22.1">Rutas y credenciales fuera del código</tspan></text><rect x="1190" y="745" width="525" height="150" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="1208" y="780" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="1208" dy="0">Carpetas de apoyo</tspan></text><text x="1208" y="811" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="1208" dy="0">tests/: unit · integration · fixtures</tspan><tspan x="1208" dy="22.1">docs/: decisiones y arquitectura</tspan><tspan x="1208" dy="22.1">assets/: imágenes y diagramas</tspan></text><rect x="35" y="980" width="1730" height="410" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="60" y="1027" font-family="Arial,sans-serif" font-size="27" fill="#334155"><tspan x="60" dy="0">02 / Incorporar y analizar la colección</tspan></text><rect x="70" y="1070" width="300" height="120" rx="12" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/><text x="88" y="1105" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="88" dy="0">1. Carpeta local</tspan></text><text x="88" y="1136" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="88" dy="0">Importación explícita</tspan><tspan x="88" dy="22.1">Detectar nuevos / cambios</tspan></text><path d="M 375 1130 L 395 1130" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="400" y="1070" width="300" height="120" rx="12" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/><text x="418" y="1105" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="418" dy="0">2. Extraer datos</tspan></text><text x="418" y="1136" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="418" dy="0">Leer metadatos</tspan><tspan x="418" dy="22.1">Analizar audio</tspan></text><path d="M 705 1130 L 725 1130" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="1070" width="300" height="120" rx="12" fill="#ede9fe" stroke="#cbd5e1" stroke-width="2"/><text x="748" y="1105" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="748" dy="0">3. Guardar catálogo</tspan></text><text x="748" y="1136" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="748" dy="0">Canción + análisis</tspan><tspan x="748" dy="22.1">Huella + versión de modelo</tspan></text><path d="M 1035 1130 L 1055 1130" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="1060" y="1070" width="300" height="120" rx="12" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/><text x="1078" y="1105" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="1078" dy="0">4. Indexar</tspan></text><text x="1078" y="1136" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="1078" dy="0">Actualizar vectores</tspan><tspan x="1078" dy="22.1">ID de canción + versión</tspan></text><path d="M 1365 1130 L 1385 1130" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="1390" y="1070" width="300" height="120" rx="12" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/><text x="1408" y="1105" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="1408" dy="0">5. Disponible</tspan></text><text x="1408" y="1136" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="1408" dy="0">Marcar lista para buscar</tspan><tspan x="1408" dy="22.1">Solo tras indexación</tspan></text><text x="70" y="1251" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="70" dy="0">POST /imports → 202 + job_id     |     GET /imports/{job_id} → progreso y errores</tspan></text><text x="70" y="1299" font-family="Arial,sans-serif" font-size="19" fill="#334155"><tspan x="70" dy="0">El análisis se ejecutará fuera de la petición HTTP. Ejecutor local propuesto; reinicios y reintentos por definir.</tspan><tspan x="70" dy="24.7">Catálogo = fuente de verdad. Reutilizar análisis vigentes; conservar estado pendiente/fallido si la indexación falla.</tspan></text><rect x="35" y="1420" width="1730" height="490" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="60" y="1467" font-family="Arial,sans-serif" font-size="27" fill="#334155"><tspan x="60" dy="0">03 / Buscar música y ajustar mediante conversación</tspan></text><rect x="70" y="1510" width="300" height="120" rx="12" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/><text x="88" y="1545" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="88" dy="0">1. Petición del DJ</tspan></text><text x="88" y="1576" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="88" dy="0">Referencias + criterios</tspan><tspan x="88" dy="22.1">Contexto conversacional</tspan></text><path d="M 375 1570 L 395 1570" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="400" y="1510" width="300" height="120" rx="12" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/><text x="418" y="1545" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="418" dy="0">2. Interpretar</tspan></text><text x="418" y="1576" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="418" dy="0">LLM → criterios</tspan><tspan x="418" dy="22.1">Validar y pedir aclaración</tspan></text><path d="M 705 1570 L 725 1570" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="1510" width="300" height="120" rx="12" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/><text x="748" y="1545" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="748" dy="0">3. Recuperar</tspan></text><text x="748" y="1576" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="748" dy="0">Similitud en índice</tspan><tspan x="748" dy="22.1">Datos desde el catálogo</tspan></text><path d="M 1035 1570 L 1055 1570" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="1060" y="1510" width="300" height="120" rx="12" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/><text x="1078" y="1545" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="1078" dy="0">4. Seleccionar</tspan></text><text x="1078" y="1576" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="1078" dy="0">Servicio aplica filtros</tspan><tspan x="1078" dy="22.1">BPM y exclusiones</tspan></text><path d="M 1365 1570 L 1385 1570" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="1390" y="1510" width="300" height="120" rx="12" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/><text x="1408" y="1545" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="1408" dy="0">5. Explicar</tspan></text><text x="1408" y="1576" font-family="Arial,sans-serif" font-size="17" fill="#334155"><tspan x="1408" dy="0">LLM usa datos reales</tspan><tspan x="1408" dy="22.1">DJ ajusta los criterios</tspan></text><text x="70" y="1691" font-family="Arial,sans-serif" font-size="21" fill="#334155"><tspan x="70" dy="0">Reglas del servicio: hasta 10 canciones · sin duplicados · excluir referencias · cumplir BPM solicitado</tspan></text><text x="70" y="1728" font-family="Arial,sans-serif" font-size="18" fill="#334155"><tspan x="70" dy="0">Si faltan candidatos, devolver los disponibles y explicar la limitación. Sin BPM conocido no se cumple un filtro obligatorio.</tspan><tspan x="70" dy="23.400000000000002">La búsqueda estructurada con POST /recommendations omite la interpretación por LLM. El LLM no garantiza los filtros.</tspan></text><text x="70" y="1798" font-family="Arial,sans-serif" font-size="18" fill="#334155"><tspan x="70" dy="0">GET /tracks  ·  GET /tracks/{track_id}  ·  POST /conversations  ·  POST /conversations/{id}/messages  ·  GET /health</tspan></text><text x="70" y="1858" font-family="Arial,sans-serif" font-size="18" fill="#334155"><tspan x="70" dy="0">Pendiente de evaluar: modelos de audio, perfiles / embeddings, métrica, varias referencias, motor vectorial y proveedor de lenguaje.</tspan></text><text x="50" y="1958" font-family="Arial,sans-serif" font-size="18" fill="#334155"><tspan x="50" dy="0">Basado en docs/architecture.md y en propuesta.excalidraw. Cada carpeta incluye su README con responsabilidades y ejemplos.</tspan></text></svg>